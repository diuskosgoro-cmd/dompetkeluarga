   Aturan: bila ragu, hasilnya DIKOSONGKAN (tidak ditebak). Daftar barang tidak dibaca. */
const RC_TOT=[
  /grand\s*total/,                                   /* 0: paling jelas */
  /total\s*belanja/,                                 /* 1 */
  /total\s*bayar/,                                   /* 2 */
  /jumlah\s*bayar/,                                  /* 3 */
  /total\s*(tagihan|pembayaran|akhir|harga)|amount\s*due|total\s*due|net\s*total|netto/, /* 4 */
  /(^|[^a-z])total(?![a-z])/                         /* 5: kata "total" saja */

const RC_BAD=/sub\s*-?\s*total|item|qty|diskon|disc|hemat|poin|point|kembali|change|tunai|cash|uang|diterima/;
const RC_BAD2=/ppn|pajak|tax|dpp/;                   /* dipakai hanya untuk baris "total" polos */

const RC_ADDR=/(^|[^a-z])(jl|jln|jalan|gg|gang|blok|no|rt|rw|kel|kec|kab|kota|kode\s*pos|telp|tel|hp|wa|npwp|kasir|cashier|struk|nota|invoice|receipt|tgl|tanggal|date|jam|time|trx|ref|bill|order|selamat|welcome|terima\s*kasih|thank|www|http)(?![a-z])|@|\.com/i;
const RC_MONEY=/(?:rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?|\d{4,7})(?![\d])/gi;
const RC_BLN={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};

function rcNum(tok){
  let s=String(tok).replace(/rp\.?/ig,'').replace(/\s/g,'');
  if(/^\d{1,3}([.,]\d{3})+[.,]\d{2}$/.test(s))s=s.slice(0,-3);   /* buang sen ",00" */

function rcFixDigits(line){

  return line.split(/(\s+)/).map(tok=>{
    const m=tok.match(/^(rp\.?)?([0-9OoIlSB.,]{4,})$/i);
    if(!m||!/\d/.test(m[2])||!/[.,]/.test(m[2]))return tok;
    const f=m[2].replace(/[Oo]/g,'0').replace(/[Il]/g,'1').replace(/S/g,'5').replace(/B/g,'8');
    return /^\d{1,3}([.,]\d{3})+([.,]\d{2})?$/.test(f)?(m[1]||'')+f:tok;

function rcMoneys(line){

    if(pre&&/\d/.test(pre))continue;                          /* potongan dari angka panjang (telepon, nomor) */
    if(pre&&/[-\/:]/.test(pre)&&!/rp/i.test(m[0]))continue;   /* bagian dari tanggal/jam */
    if(post&&/[\/:]/.test(post))continue;
    const v=rcNum(m[1]);

const rcNorm=l=>l.toLowerCase().replace(/t[0o]ta[l1|!]/g,'total').replace(/\s+/g,' ');

/* Nama toko: baris-baris awal (kepala struk) yang berisi huruf, bukan alamat/telepon/nomor transaksi */
function rcStore(lines){
  const ok=[],pt=[];
  for(const l of lines.slice(0,8)){
    const s=l.replace(/[|_~=*#@\\]+/g,' ').replace(/\s+/g,' ').trim();

    if(!/[A-Za-z]{3,}/.test(s))continue;            /* tidak ada satu kata utuh */
    if(RC_ADDR.test(s)||/\d{4,}/.test(s)||/\d{1,2}[\/.:]\d{1,2}/.test(s))continue;
    if(rcMoneys(s).length)continue;

    if(nm.length<3)continue;
    (/^(pt|cv|ud)\b/i.test(nm)?pt:ok).push(nm);     /* nama badan usaha (PT/CV) jadi pilihan terakhir */

}

function rcMkDate(d,m,y,short){

  if(y<100)y+=2000;

function rcDates(line){

function rcDate(lines){

/* Total belanja: hanya dari baris berlabel total. Tidak ada label -> kosong (tidak menebak).
   Bila ada beberapa nilai BERBEDA pada label yang sama -> kosong, nilai-nilainya jadi pilihan. */
function rcTotal(lines){
  const found=RC_TOT.map(()=>[]);
  lines.forEach((l,i)=>{
    const n=rcNorm(l);
    if(RC_BAD.test(n))return;
    for(let p=0;p<RC_TOT.length;p++){
      if(!RC_TOT[p].test(n))continue;
      if(p===RC_TOT.length-1&&RC_BAD2.test(n))break;

    }

    if(vals.length===1)return{v:vals[0],label:f[f.length-1].l,cands:vals};
    return{v:0,label:'',cands:vals.slice(0,4)};
  }

function aiClean(j){

function rcFill(d,raw,x){

/* ===== Pengingat tagihan: push OneSignal (Median) dijadwalkan lewat /api/reminders (Vercel) ===== */
(function(){
const REM_API=/^https?:$/.test(location.protocol)?location.origin+'/api/reminders':'',RK='dk-rem',HORIZON=25*864e5;
const inApp=()=>/median|gonative/i.test(navigator.userAgent)&&window.median&&window.median.onesignal;
const load=()=>{try{const o=JSON.parse(localStorage.getItem(RK));return{i:(o&&o.i)||{},c:(o&&o.c)||[]}}catch(e){return{i:{},c:[]}}};
const store=o=>{try{localStorage.setItem(RK,JSON.stringify(o))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
/* Daftar pengingat yang seharusnya ada: H-1 dan hari-H, pukul 08.00 waktu HP */
function want(){
  const out={};
  if(!meOk()||!can('bill'))return out;
  const t=Date.now(),d0=new Date();
  S.bills.forEach(b=>{
    const day=+b.day;if(!(day>=1&&day<=31))return;
    for(let mo=0;mo<2;mo++){
      if(mo===0&&b.paid===cur())continue;
      const y=d0.getFullYear(),m=d0.getMonth()+mo,last=new Date(y,m+1,0).getDate(),due=new Date(y,m,Math.min(day,last));
      [[1,'besok'],[0,'hari ini']].forEach(([off,w])=>{
        const at=new Date(due.getFullYear(),due.getMonth(),due.getDate()-off,8,0,0).getTime();
        if(at<=t+6e4||at>t+HORIZON)return;
        const title='Tagihan '+b.name+' jatuh tempo '+w,body=rp(b.amt)+' · jangan sampai telat bayar';
        out[ME+':'+b.id+':'+due.getFullYear()+'-'+p2(due.getMonth()+1)+'-'+p2(due.getDate())+':'+off+':'+hs(title+body)]={at,title,body};
      });
    }
  });
  return out;
}
let busy=false,nextOk=0,lastMe=null;
async function ident(){
  if(!inApp())return;
  const me=meOk()?ME:'';
  if(me===lastMe)return;
  try{if(me)await median.onesignal.login(me);else await median.onesignal.logout();lastMe=me}catch(e){}
}
async function sync(){
  if(busy||!REM_API||!inApp())return;
  const w=want(),db=load(),it=db.i,t=Date.now();
  Object.keys(it).forEach(k=>{if(it[k].at<t-864e5)delete it[k]});
  Object.keys(it).forEach(k=>{if(!w[k]){if(it[k].id)db.c.push(it[k].id);delete it[k]}});
  Object.keys(w).forEach(k=>{if(!it[k])it[k]={n:uid(),id:'',at:w[k].at}});
  store(db);
  const pend=Object.keys(it).filter(k=>!it[k].id);
  if((!pend.length&&!db.c.length)||t<nextOk)return;
  nextOk=t+30000;busy=true;
  try{
    const r=await fetch(REM_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      externalId:ME,cancel:db.c.slice(0,50),
      add:pend.slice(0,20).map(k=>({key:k,n:it[k].n,at:it[k].at,title:w[k].title,body:w[k].body}))})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),d2=load();
    (j.added||[]).forEach(a=>{if(d2.i[a.key]&&a.id)d2.i[a.key].id=a.id});
    (j.errors||[]).forEach(e=>{if(d2.i[e.key])d2.i[e.key].n=uid()});   /* gagal: coba lagi dengan kunci baru */
    d2.c=d2.c.filter(id=>!(j.cancelled||[]).includes(id));
    store(d2);
    if((j.errors||[]).length)nextOk=Date.now()+300000;
  }catch(e){nextOk=Date.now()+300000}
  finally{busy=false}
}
const tick=()=>{ident().then(sync).catch(()=>{})};
setTimeout(tick,2500);setInterval(tick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
})();
